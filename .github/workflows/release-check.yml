name: Release check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # main only takes dev from this repo. The test lives in the `if`, not in
  # `run:`, so the branch name never reaches a shell.
  only-dev-to-main:
    if: github.head_ref != 'dev' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "::error::PRs into main must come from dev"
          exit 1

  # Every release is deliberate: a PR into main must raise versionName and
  # versionCode past the latest v* tag and add the version's CHANGELOG.md section.
  version-bumped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags

      - name: Version is past the latest tag
        run: |
          name() { sed -nE 's/^ *versionName = "([^"]+)".*/\1/p'; }
          code() { sed -nE 's/^ *versionCode = ([0-9]+).*/\1/p'; }
          VERSION=$(name < app/build.gradle.kts)
          CODE=$(code < app/build.gradle.kts)
          if [ -z "$VERSION" ] || [ -z "$CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          if ! grep -qE "^## $(printf '%s' "$VERSION" | sed 's/\./\\./g')( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION — YYYY-MM-DD' section"
            exit 1
          fi
          # Prod tags only: the glob alone matches v0.1.0-alpha.1, which sort -V ranks above v0.1.0.
          LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            echo "No release tag yet; $VERSION ($CODE) passes."
            exit 0
          fi
          LATEST_CODE=$(git show "v$LATEST:app/build.gradle.kts" | code)
          HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -V | tail -n 1)
          if [ "$VERSION" = "$LATEST" ] || [ "$HIGHEST" != "$VERSION" ]; then
            echo "::error::versionName is $VERSION, latest release is v$LATEST. Raise it in app/build.gradle.kts and add its CHANGELOG.md section"
            exit 1
          fi
          if [ "$CODE" -le "${LATEST_CODE:-0}" ]; then
            echo "::error::versionCode is $CODE, v$LATEST shipped $LATEST_CODE. Raise it in app/build.gradle.kts"
            exit 1
          fi
          echo "$VERSION ($CODE) is past v$LATEST ($LATEST_CODE)."
